name: Build Mac App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name OttoReviewTool \
            --osx-bundle-identifier com.otto.reviewtool \
            --target-architecture universal2 \
            --hidden-import openpyxl --hidden-import openpyxl.styles \
            --hidden-import openpyxl.utils main2.py

      - name: Zip the .app properly
        run: |
          cd dist
          zip -r -y OttoReviewTool-mac.zip OttoReviewTool.app

      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Mac-OttoReviewTool
          path: dist/OttoReviewTool-mac.zip
